[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nist-strm"
version = "0.1.0"
description = "NIST Set Theory Relationship Mapping (STRM) library implementing IR 8477 and IR 8278Ar1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NIST STRM Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
prov = ["prov>=2.0"]
xlsx = ["openpyxl>=3.1"]
all = ["prov>=2.0", "openpyxl>=3.1"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "prov>=2.0",
    "openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nist_strm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
