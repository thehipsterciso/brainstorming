[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-enrichment"
version = "0.1.0"
description = "AI-driven autonomous knowledge graph enrichment with dynamic schema discovery"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "anthropic>=0.84.0",
    "networkx>=3.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9",
    "trafilatura>=1.8",
    "click>=8.1",
    "rich>=13.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
finance = [
    "edgartools>=5.0",
    "yfinance>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[project.scripts]
kg-enrich = "kg_enrichment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
